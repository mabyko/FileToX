name: FileToX
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 2
    DEVELOPMENT_LANGUAGE: en
packages:
  # The engine, its helper executable, tests and every native library are defined once, in Package.swift. Xcode
  # consumes that package; project.yml only adds what SwiftPM cannot build: the app bundles, signing and embedding.
  Engine:
    path: .
targets:
  FileToX:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Engine
          - EngineMain
      - path: Resources
        buildPhase: resources
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FILETOX_BUNDLE_ID)
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: FileToX
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko, ja]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "FileToX · Inspired by Filee"
    dependencies:
      - target: FileToXEngine
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
  # The helper app the main app starts (Contents/Helpers/FileToXEngine.app), with the bundled rhwp and 7-Zip.
  FileToXEngine:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - Sources/EngineMain
    dependencies:
      - package: Engine
        product: FileToXEngineKit
      # PDFium is linked by the package (Vendor/PDFium); the helper embeds and signs the dylib.
      - framework: Vendor/PDFium/lib/libpdfium.dylib
        embed: true
        codeSign: true
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: [$(inherited), "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
        PRODUCT_NAME: FileToXEngine
        PRODUCT_BUNDLE_IDENTIFIER: $(FILETOX_BUNDLE_ID).enginehost
        SWIFT_VERSION: "5.0"
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/EngineHost.Info.plist
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES
    postBuildScripts:
      - name: Stage bundled engines (rhwp, 7-Zip)
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/Tools/stage-bundled-engines.sh"
  FileToXEngineTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Tests/Engine
        excludes: [Pdf/Fixtures]
    dependencies:
      - package: Engine
        product: FileToXEngineKit
      - package: Engine
        product: CLibRaw
      - framework: Vendor/PDFium/lib/libpdfium.dylib
        embed: true
        codeSign: true
      - target: FileToXEngine
        embed: false
        link: false
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: [$(inherited), "@loader_path/../Frameworks"]
        PRODUCT_BUNDLE_IDENTIFIER: $(FILETOX_BUNDLE_ID).enginetests
        # Logic tests: the helper is a dependency only so host tests can launch it, not their test host.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.0"
        ARCHS: $(NATIVE_ARCH_ACTUAL)
  FileToXTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - Tests/Platform
      - Tests/App
    dependencies:
      - target: FileToX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FILETOX_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APP_DISPLAY_NAME).app/Contents/MacOS/$(APP_DISPLAY_NAME)
schemes:
  FileToX:
    build:
      targets:
        FileToX: all
        FileToXEngine: all
        FileToXTests: [test]
        FileToXEngineTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FileToXTests
        - FileToXEngineTests
