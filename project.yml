name: FileToX
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 2
    DEVELOPMENT_LANGUAGE: en
packages:
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode.git
    exactVersion: 1.6.0
  libjxl:
    url: https://github.com/SDWebImage/libjxl-Xcode.git
    exactVersion: 0.10.4
  # libjpeg-turbo 3.2.0 from source (Vendor/libjpeg-turbo/README.FileToX.md): JPEG writing and LibRaw's lossy DNG.
  libjpeg-turbo:
    path: Vendor/libjpeg-turbo
targets:
  FileToX:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Engine
          - EngineMain
      - path: Resources
        buildPhase: resources
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FILETOX_BUNDLE_ID)
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: FileToX
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko, ja]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "FileToX · Inspired by Filee"
    dependencies:
      - target: FileToXEngine
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
  # Camera RAW: LibRaw 0.22.2 (CDDL-1.0) and FileToX's shim, the module CLibRaw (Vendor/LibRaw/README.FileToX.md).
  # Same defines as Package.swift (USE_JPEG: libjpeg-turbo's headers; the helper links it); LibRaw's warnings are silenced.
  CLibRaw:
    type: library.static
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Vendor/LibRaw
        headerVisibility: project # found through the search paths below, not copied into the products
        excludes:
          - "*.md"
          - COPYRIGHT
          - LICENSE.*
          - FileToX/include/module.modulemap # read in place through SWIFT_INCLUDE_PATHS
    settings:
      base:
        PRODUCT_NAME: CLibRaw
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        SKIP_INSTALL: YES
        GCC_PREPROCESSOR_DEFINITIONS: [LIBRAW_NODLL, USE_ZLIB, USE_JPEG]
        HEADER_SEARCH_PATHS: [$(SRCROOT)/Vendor/LibRaw, $(SRCROOT)/Vendor/LibRaw/FileToX/include, $(SRCROOT)/Vendor/libjpeg-turbo/src,
                              $(SRCROOT)/Vendor/libjpeg-turbo/FileToX/config]
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
  # The conversion engine (Sources/Engine), shared by the helper and its tests. Swift 5 mode: line-by-line port of C#.
  FileToXEngineKit:
    type: library.static
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Sources/Engine
        excludes:
          - Resources
    dependencies:
      - package: libwebp
        link: true
      - package: libjxl
        link: true
      - package: libjxl
        product: brotli
        link: true
      - package: libjpeg-turbo
        product: CJpegTurbo
        link: true
    settings:
      base:
        PRODUCT_NAME: FileToXEngineKit
        SWIFT_VERSION: "5.0"
        # CLibRaw is only imported here (its header); the helper and the tests link it. No target dependency, so
        # LibRaw compiles alongside the Swift code instead of before it.
        SWIFT_INCLUDE_PATHS: [$(SRCROOT)/Vendor/LibRaw/FileToX/include, $(SRCROOT)/Vendor/PDFium/include]
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        SKIP_INSTALL: YES
  # The helper app the main app starts (Contents/Helpers/FileToXEngine.app), with the bundled rhwp and 7-Zip.
  FileToXEngine:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - Sources/EngineMain
      - path: Sources/Engine/Resources
        type: folder
        buildPhase: resources
    dependencies:
      - target: FileToXEngineKit
      - target: CLibRaw
      - framework: Vendor/PDFium/lib/libpdfium.dylib
        embed: true
        codeSign: true
      - package: libwebp
      - package: libjxl
      - package: libjxl
        product: brotli
      - package: libjpeg-turbo
        product: CJpegTurbo
      - sdk: libxml2.tbd
      - sdk: libz.tbd
    settings:
      base:
        LIBRARY_SEARCH_PATHS: [$(inherited), $(SRCROOT)/Vendor/PDFium/lib]
        LD_RUNPATH_SEARCH_PATHS: [$(inherited), "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
        PRODUCT_NAME: FileToXEngine
        PRODUCT_BUNDLE_IDENTIFIER: $(FILETOX_BUNDLE_ID).enginehost
        SWIFT_VERSION: "5.0"
        SWIFT_INCLUDE_PATHS: [$(SRCROOT)/Vendor/LibRaw/FileToX/include, $(SRCROOT)/Vendor/PDFium/include]
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/EngineHost.Info.plist
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES
    postBuildScripts:
      - name: Stage bundled engines (rhwp, 7-Zip)
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/Tools/stage-bundled-engines.sh"
  FileToXEngineTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Tests/Engine
        excludes: [Pdf/Fixtures]
      - path: Sources/Engine/Resources
        type: folder
        buildPhase: resources
    dependencies:
      - target: FileToXEngineKit
      - target: CLibRaw
      - framework: Vendor/PDFium/lib/libpdfium.dylib
        embed: true
        codeSign: true
      - target: FileToXEngine
        embed: false
        link: false
      - package: libwebp
      - package: libjxl
      - package: libjxl
        product: brotli
      - package: libjpeg-turbo
        product: CJpegTurbo
      - sdk: libxml2.tbd
      - sdk: libz.tbd
    settings:
      base:
        LIBRARY_SEARCH_PATHS: [$(inherited), $(SRCROOT)/Vendor/PDFium/lib]
        LD_RUNPATH_SEARCH_PATHS: [$(inherited), "@loader_path/../Frameworks"]
        PRODUCT_BUNDLE_IDENTIFIER: $(FILETOX_BUNDLE_ID).enginetests
        SWIFT_INCLUDE_PATHS: [$(SRCROOT)/Vendor/LibRaw/FileToX/include, $(SRCROOT)/Vendor/PDFium/include]
        # Logic tests: the helper is a dependency only so host tests can launch it, not their test host.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.0"
        ARCHS: $(NATIVE_ARCH_ACTUAL)
  FileToXTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - Tests/Platform
      - Tests/App
    dependencies:
      - target: FileToX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FILETOX_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APP_DISPLAY_NAME).app/Contents/MacOS/$(APP_DISPLAY_NAME)
schemes:
  FileToX:
    build:
      targets:
        FileToX: all
        FileToXEngine: all
        FileToXTests: [test]
        FileToXEngineTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FileToXTests
        - FileToXEngineTests
